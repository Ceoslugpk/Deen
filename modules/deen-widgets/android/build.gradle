apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.deenwidgets'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.deenwidgets"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Glance is Compose for app widgets. Refreshing the widgets means reaching
  // them through Glance, so the dependency belongs here rather than only in
  // the app, where the widget sources live.
  implementation "androidx.glance:glance-appwidget:1.1.1"
}
