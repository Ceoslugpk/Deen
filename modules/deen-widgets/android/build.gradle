// All widget sources/resources live in this autolinked library. The app no
// longer needs fragile Compose/source/Gradle text injection.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.deenwidgets'
version = '0.2.0'
expoModule { canBePublished false }
android {
  namespace 'expo.modules.deenwidgets'
  buildFeatures { compose true }
  defaultConfig { consumerProguardFiles 'consumer-rules.pro' }
}
dependencies {
  implementation 'androidx.glance:glance-appwidget:1.1.1'
  implementation 'androidx.datastore:datastore-preferences:1.1.1'
  implementation 'androidx.work:work-runtime-ktx:2.10.5'
}
